[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renewcast"
version = "0.1.0"
description = "Hourly solar and wind power forecasting for Germany from DWD HOSTRADA weather grids with CNNs."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["renewable-energy", "forecasting", "deep-learning", "cnn", "solar", "wind", "germany"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Deep-learning backend. Needed for `train` / `evaluate`; not needed for data prep or the CPU baseline.
tf = ["tensorflow>=2.16"]
# Map plots (cartopy) used by the `eda` command.
viz = ["cartopy>=0.22"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
renewcast = "renewcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Notebooks are kept as the original record of the experiment and are never reformatted.
extend-exclude = ["*.ipynb", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.isort]
known-first-party = ["renewcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "keras: tests that need a Keras 3 backend (skipped automatically when it is not installed)",
]

[tool.coverage.run]
source = ["src/renewcast"]
branch = true
